spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_pharmacy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: pharmacy_user
    password: pharmacy_pass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

    open-in-view: false

  h2:
    console:
      enabled: false